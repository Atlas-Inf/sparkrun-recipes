recipe_version: "2"
model: thinkingmachines/Inkling-2-Mini
runtime: atlas
container: atlas-gb10-local:sha-c94c7c1
max_nodes: 1
metadata:
  description: |
    Thinking Machines' Inkling 2 Mini (26.4B total / 3.4B active looped MoE, Apache-2.0) on one GB10 in
    Spark mode: the checkpoint as shipped plus the calibrated NVFP4 Spark overlay
    (Enntity/Inkling-2-Mini-Spark-NVFP4: attention projections, lm_head, layer 20-23 experts; KL 0.0081 to the
    checkpoint), the checkpoint's own DSpark drafter, and adaptive speculation. The recommended Inkling recipe.
    Credit: the Inkling 2 engine port is Atlas-Inf/atlas#401 by @data-angel (SparkInkling,
    github.com/Enntity/sparkinkling, which also publishes the overlay); the --weight-overlay / embedded-drafter
    load path that lets this recipe serve from the HF repos is atlas feat/inkling2-401-sparkrun (c94c7c1c6).
    Licenses: Inkling 2 Mini and the Spark overlay are Apache-2.0; Atlas is AGPL-3.0-only.
    Serves straight from the Hugging Face repos, no manual steps:
      --weight-overlay Enntity/Inkling-2-Mini-Spark-NVFP4       overlay tensors added under their own names
      --draft-model thinkingmachines/Inkling-2-Mini             DSpark = the checkpoint's mtp.safetensors + mtp_config
      ATLAS_DFLASH_BATCH_DEPTH=1:7,1000000:0                    DSpark speculates for a lone request only
      ATLAS_DFLASH_ADAPTIVE=1                                   a sequence whose drafts stop paying decodes plainly
    Tested revisions: thinkingmachines/Inkling-2-Mini ed40e7da625f594fc9c4990f5f66be24873c22d7,
    Enntity/Inkling-2-Mini-Spark-NVFP4 e9df93dceea2fbf0927caf178104e868452a6292 (not pinned in the recipe: Atlas
    resolves an HF id offline through refs/main, which a pinned download does not write).
    MEASURED: TBD (sparky GB10, #401 head e6a8a0420).
    RECIPE VET: TBD.
    DEPENDS ON Atlas-Inf/atlas#401 + the feat/inkling2-401-sparkrun follow-up merging; the container is a local
    build of that branch with docker/gb10/Dockerfile until then, and is re-pinned to the post-merge
    ghcr.io/atlas-inf/atlas-gb10:sha-<merge> image before this recipe merges.
  maintainer: Atlas
  category: agent
  model_params: 26.4B-A3.4B looped MoE (24 physical layers, core 6-17 run three times = 48 visits)
  model_dtype: nvfp4
  quantization: "NVFP4 experts L0-19 + MXFP8 experts L20-23 (checkpoint) with the Spark NVFP4 overlay over attention, lm_head and L20-23 experts"
  kv_dtype: bf16
  updated: "2026-11-22"

env:
  ATLAS_DFLASH_BATCH_DEPTH: "1:7,1000000:0"
  ATLAS_DFLASH_ADAPTIVE: "1"

distribution_config:
  models:
    entries:
      - name: thinkingmachines/Inkling-2-Mini
      - name: Enntity/Inkling-2-Mini-Spark-NVFP4

defaults:
  host: 0.0.0.0
  port: 8888
  served_model_name: inkling-2-mini
  gpu_memory_utilization: 0.80
  max_model_len: 131072
  max_num_seqs: 8

command: |
  spark serve thinkingmachines/Inkling-2-Mini \
    --host {host} --port {port} --model-name {served_model_name} \
    --kernel-target inkling-2-mini \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --kv-cache-dtype bf16 \
    --max-num-seqs {max_num_seqs} --max-batch-size {max_num_seqs} \
    --max-seq-len {max_model_len} --max-prefill-tokens 4096 \
    --enable-prefix-caching \
    --weight-overlay Enntity/Inkling-2-Mini-Spark-NVFP4 \
    --dflash --dflash-gamma 8 --num-drafts 7 \
    --draft-model thinkingmachines/Inkling-2-Mini \
    --no-tui
