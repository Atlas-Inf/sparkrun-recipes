recipe_version: "2"
model: Qwen/Qwen3.6-27B-FP8
runtime: atlas
container: avarok/atlas-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.6-27B (dense, native FP8) on the Atlas runtime, with the
    upstream-bundled MTP draft head (mtp.safetensors, FP8 e4m3 linear +
    BF16 norms) enabled for K=2 speculative decoding. KV stays BF16
    (FP8/NVFP4 KV breaks dense attention — request timeouts + CUDA
    graph thrash). max_model_len capped at 60_000 so the full
    spark-arena-v2 concurrency=10 sweep fits in the KV pool on a
    single GB10; cells at depth=65535/100000 in spark-arena-v2 will be
    skipped because they exceed max_model_len. Use --tp 2 / EP=2 to
    get the full long-context sweep.
  maintainer: avarok
  category: chat
  model_params: 27B
  model_dtype: fp8
  quantization: fp8
  kv_dtype: bf16

defaults:
  port: 8888
  host: 0.0.0.0
  # 60k, not 262144: the full spark-arena-v2 concurrency=10 sweep has to
  # fit in the KV pool on a single GB10. At 262144 the pool is oversized,
  # the sweep never completes, and the benchmark stalls out.
  max_model_len: 60000
  max_batch_size: 2
  max_num_seqs: 2
  # bf16, NOT fp8: FP8/NVFP4 KV breaks dense attention on this model —
  # request timeouts + CUDA-graph thrash. (`kv_high_precision_layers` is
  # an fp8-KV knob and is intentionally absent.)
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.88
  scheduling_policy: slai
  speculative: true
  # K=2, as the description states. `speculative: true` alone falls back
  # to MODEL.toml's default_num_drafts = 1.
  num_drafts: 2
  mtp_quantization: bf16
  enable_prefix_caching: true
  oom_guard_mb: 1024
