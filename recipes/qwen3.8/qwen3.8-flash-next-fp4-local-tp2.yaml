recipe_version: "2"
model: nvidia/Qwen3.8-Flash-Next-FP4-Local
runtime: atlas
container: ghcr.io/atlas-inf/atlas-gb10:sha-9c45191
min_nodes: 2
max_nodes: 2

metadata:
  description: |
    NVIDIA's quantization-aware Qwen3.8-Flash-Next-FP4-Local (`model_type: qwen4_exp`) on
    TWO GB10s, TP=EP=2, in the checkpoint's own formats (NVFP4 experts with CSF scales,
    MXFP8 attention / GDN / shared expert, BF16 router, F32 norms). The 28.8 GB NVFP4
    n-gram table is resident on both ranks (ATLAS_PLE_RESIDENT=1). This is SparkQwen's
    product checkpoint.

    Engine and serve line: SparkQwen 0.4.0's 8x32k profile in Spark mode (Enntity), on
    Atlas main as published by ghcr.io/atlas-inf/atlas-gb10 (the image tag is the main
    commit). Main serves it with the same logits as SparkQwen 0.4.0's engine (KL 0 on
    teacher-forced and generated top-20 distributions, text and vision, Spark and Strict
    modes; Atlas-Inf/atlas#220).

    FABRIC. Each Spark needs an IPv4 address on the cable's netdev. If that netdev
    carries more than one IPv4 address, set NCCL_SOCKET_IFNAME / NCCL_IB_ADDR_RANGE in
    the sparkrun cluster file (cluster env overrides per-host detection), e.g.
      NCCL_SOCKET_IFNAME: "=<netdev on node A>,<netdev on node B>"
      NCCL_IB_ADDR_RANGE: <cable subnet, e.g. 10.99.2.0/30>

    MEASURED 2026-11-02 with this file through `sparkrun run ... --cluster <pair>` on one pair
    (reiner + spark2, one CX7 cable), image sha-9c45191: up in 195 s. Logit drift vs the
    same engine served natively: KL 0 over 34,245 positions (teacher-forced top-20 on 6 text
    cases + 4 generated chat cases). Greedy at C1 identical 8/8 to native main (= SparkQwen
    0.4.0's); C8 == C1 8/8. tool_probe 3/3 in every category. sq_bench (thinking at the
    template default): decode prose / code / JSON 60.6-61.2 / 92.1-92.5 / 70.8-71.2 tok/s;
    aggregate C1 / C2 / C4 57.9-60.6 / 90.1-93.6 / 140.1-142.8 tok/s; cold TTFT 2K / 8K
    0.66 / 1.91 s.
  maintainer: atlas-inf
  category: general
  model_params: 180B
  model_dtype: nvfp4
  quantization: fp4-local
  kv_dtype: bf16
  updated: "2026-11-02"

defaults:
  port: 8889
  host: 0.0.0.0
  kernel_target: qwen3.8-flash-next
  tensor_parallel: 2
  ep_size: 2
  max_model_len: 32768
  max_prefill_tokens: 16384
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.88
  oom_guard_mb: 4096
  max_num_seqs: 8
  max_batch_size: 8
  speculative: true
  num_drafts: 7
  enable_prefix_caching: true
  fast_load_prefetch_shards: true
  tool_max_tokens: 32768
  tool_guard: on
  tool_guard_max_bytes: 1048576

