recipe_version: "2"
model: nvidia/Qwen3.8-Flash-Next-NVFP4
runtime: atlas
container: ghcr.io/atlas-inf/atlas-gb10:latest
max_nodes: 1

metadata:
  description: |
    nvidia/Qwen3.8-Flash-Next-NVFP4 — the vendor NVFP4 pack of the same
    ~180B hybrid multimodal MoE (`model_type: qwen4_exp`) the sibling
    `qwen3.8-flash-next-nvfp4` recipe serves from RadixArk. Same 48-layer
    GDN/full-attention interleave, 512 experts top-10 + shared, 4-stream
    hyper-connection residual, QSA sparse-attention indexer, PLE n-gram
    injection at layer 1, ViT tower, MTP draft block.

    WHAT DIFFERS FROM THE RADIXARK PACK (format, not architecture —
    verified by config+index diff 2026-09-14, loader support on
    `feat/flashnext-nvidia`):
      * `quant_algo: MIXED_PRECISION` with a 50-entry `quantized_layers`
        map: 48x NVFP4-g16 `mlp.experts`, 1x FP8 PLE n-gram embedding,
        1x FP8_PB_WO-g128 MTP expert block. The map, not the top-level
        label, is authoritative.
      * MTP experts ship per-expert FP8 block-scales
        (`experts.{e}.{gate,up,down}_proj.weight` + `weight_scale_inv`)
        instead of RadixArk's fused BF16 pair — dequant->requant to NVFP4
        in the loader. This is what lets the MTP draft block fit at
        production util.
      * Routed experts carry static FP4 input-activation scales — genuine
        W4A4, not weight-only W4A16.
      * 11 safetensors shards (~132.7 GB) vs RadixArk's 206 (~135.3 GB).
      * 292-entry `exclude_modules` glob list; everything not NVFP4
        (attention, GDN, hyper-connections, shared expert, embeddings,
        lm_head) is BF16 — same as RadixArk.

    SERVE PROFILE IS CARRIED OVER VERBATIM from the RadixArk sibling —
    the architecture is identical, so its tested defaults transfer. THE
    MEASURED NUMBERS DO NOT: every figure in that recipe's description
    (decode rate, TTFT ladder, BFCL splits, memory footprint) was measured
    on RadixArk weights and is re-measured on this checkpoint before any
    of it is claimed here. First records: jobqueue legs
    013-smoke / 014-bfcl-st995 / 015-agentic-2.5h on reiner.

    KV stays BF16 — this pack ships no k/v scales either. Speculative ON
    at num_drafts 1 (K=2): on RadixArk that arm measured +18.4% at C=1;
    the nvidia MTP block arrives pre-quantized so the same arm is the
    point of the port.
  maintainer: atlas-inf
  category: general
  model_params: 180B
  model_dtype: nvfp4
  quantization: "nvfp4 (mixed precision: NVFP4 experts, FP8 PLE, FP8_PB_WO MTP)"
  kv_dtype: bf16

defaults:
  port: 8889
  host: 0.0.0.0
  kernel_target: qwen3.8-flash-next
  max_seq_len: 32768
  max_prefill_tokens: 32768
  # bf16, not fp8 — this checkpoint ships no k/v scales.
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.90
  max_num_seqs: 1
  max_batch_size: 1
  speculative: true
  num_drafts: 1
  enable_prefix_caching: true
  fast_load_prefetch_shards: true
  # The chat template gates its whole scaffold on enable_thinking, and a
  # bare render collapses chat to a 2-token EOS. `low` keeps the budget
  # cheap while still rendering the full preamble.
  default_chat_template_kwargs: '{"reasoning_effort":"low"}'
