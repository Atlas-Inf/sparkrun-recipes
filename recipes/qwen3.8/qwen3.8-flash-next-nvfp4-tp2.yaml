recipe_version: "2"
model: nvidia/Qwen3.8-Flash-Next-NVFP4
runtime: atlas
# Needs Atlas-Inf/atlas#174 (qwen3.8-flash-next TP=EP=2) on main and a :latest image built after it; merge
# this recipe after both. The measurements below are from that PR's tree (25a7545f5: main 7ffd183f + Enntity
# upstream/qwen38-flash-next-20261006 + sparkqwen/atlas-20261010-rc16 + the RDMA link-address GID fix + the
# startup cuBLASLt agreement); the gates ran on 2542d6e6e, the same engine without the two fixes. This file
# was launched through sparkrun on the PR head e7d951ccf (image built from it); see SPARKRUN below.
container: azeezish/atlas-gb10:latest
min_nodes: 2
max_nodes: 2

metadata:
  description: |
    Qwen3.8-Flash-Next (`model_type: qwen4_exp`) on TWO GB10s, tensor and expert
    parallel (TP=EP=2): Gated DeltaNet and attention sharded, the 512 routed experts
    split across the pair, mHC / PLE / QSA indexer / LM head replicated. The pair
    talks over one ConnectX-7 cable: Atlas's own RDMA all-reduce, one-shot small
    all-reduce and command ring carry the per-token traffic; NCCL is the fallback.
    Engine options and the serve line are SparkQwen's RC16 8x32k profile (Enntity),
    run unchanged on Atlas main.

    EXACT: with speculation (MTP, up to 7 drafts) and prefix caching on, greedy
    output at 1, 4 and 8 concurrent requests, and behind a ~4.4K-token cached
    prefix, is identical to one-at-a-time decode with both off (sparkqwen
    bench/greedy_eq.py, 8 prompts, thinking low: 8/8 in every case). The reference
    texts hash 8199ce ... 1c6136, the same as SparkQwen's RC16 receipts on their
    pair. TP=2 output is not bit-identical to one GB10 (BF16 rounding of the
    tensor-parallel sums).

    MEASURED 2026-10-14 on one pair (reiner + spark2, one RDMA rail per node,
    the same libcublasLt 13.0.2.14 on both ranks), single session per number,
    served name nvidia/Qwen3.8-Flash-Next-NVFP4:
      MLPerf edge ST-995 (bfcl-subset --url, no overrides): overall 85.83,
        normalized 85.48 (bars 82.72 / 81.65), 7,295 s. One GB10 on main:
        86.23 / 86.81, 13,245 s. The gap is the hallucination category
        (94.51 -> 89.58, about 5 of 112 samples).
      MLPerf edge agentic 2.5 h leg (thinking off, C=1): 1007/1007, score
        0.5125, 2,233 s, TPOT median 26.0 ms, TTFT median 492 ms. One GB10 on
        main: 0.5053, 4,217 s, 48.2 ms, 990 ms.
      sq_bench (thinking low): C1 decode prose/code/JSON 53.1 / 68.6 / 63.3
        tok/s; aggregate C1/C2/C4/C8 49.6 / 84.2 / 129.3 / 193.4 tok/s; cold
        TTFT 2K/8K/16K/28K 0.81 / 2.23 / 4.36 / 7.76 s; warm follow-up 0.18-0.20 s.
      KV pool: 3,112,608 tokens at util 0.88 (prefill MoE reads the checkpoint's
        own planes; no K-major duplicate). tool_probe 21/21. 0 faults on both ranks.
      4 x 262K variant (max_num_seqs/max_batch_size 4, max_model_len 262144):
        77K-token needle correct, TTFT 22.3 s, 54.3 tok/s; warm follow-up 0.3 s.
        (tool_probe and the 262K needle ran before the cuBLAS was matched.)

    SPARKRUN (2026-10-16, this file unchanged, `sparkrun run ... --cluster <pair>`,
    image of #174 head e7d951ccf, one session): greedy output at C1 and C8 and
    behind the cached prefix at C4 is 8/8 identical to the reference hashes above;
    tool_probe 21/21; 0 faults on both ranks. sparkrun hands the engine both PCIe
    halves of the port, so it ran two RDMA rails. sq_bench: C1 decode prose/code/
    JSON 51.2-52.2 / 65.8-66.9 / 61.5-61.7 tok/s (3 repeats each), aggregate C1
    50.2 / 47.8 and C8 197.1 / 192.4 tok/s (2 repeats each).

    NUMERICS POLICY. This profile keeps SparkQwen's tensor-core MoE and mHC
    decode (ATLAS_QWEN4EXP_MOE_TC, _HC_MMA, _MOE_NO_CLAMP, _HC_STAGE_FIT), which
    set a new numerics baseline. Dropping those four and ATLAS_LOOP_STEER keeps
    main's numerics, stays exact, and measured ST-995 85.53 / 86.14, the same
    TTFT, C1 decode 51.8 / 65.2 / 63.3 tok/s and C4/C8 aggregate 113.2 / 160.9
    tok/s (vs 129.3 / 193.4).

    FABRIC. Each Spark needs an IPv4 address on the cable's netdev. If that netdev
    carries more than one IPv4 address (e.g. a LAN address too), the engine picks
    the RoCE v2 GID on the address the peer reached it at; ATLAS_RDMA_GID overrides.
    NCCL's bootstrap and IB out-of-band sockets bind to the FIRST IPv4 address of
    NCCL_SOCKET_IFNAME; if the peer cannot reach that address, NCCL init hangs
    after the unique-ID exchange. If a node's cable netdev lists another address
    first, fix it in the sparkrun cluster file, not here (cluster env overrides
    sparkrun's per-host detection):
      env:
        NCCL_SOCKET_IFNAME: "=<netdev on node A>,<netdev on node B>"  # exact names; each
                            # node matches only its own up netdev the peer can reach
        NCCL_IB_ADDR_RANGE: <cable subnet, e.g. 10.99.2.0/30>   # NCCL's own GID choice
    One rail is enough: striping over both PCIe halves of the port measured no
    meaningful gain.

    BOTH RANKS MUST LOAD THE SAME cuBLAS (the image's CUDA 13.0). With 13.1 on
    one rank and 13.0 on the other, cached-prefix output stopped matching the
    uncached output; the engine now refuses to start ranks on different
    libcublasLt versions. Same binary, profile and util on both ranks: the ranks
    refuse to start otherwise.

    BF16 KV only: the QSA indexer requires it.
  maintainer: atlas-inf
  category: general
  model_params: 180B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: bf16

defaults:
  port: 8889
  host: 0.0.0.0
  kernel_target: qwen3.8-flash-next
  tensor_parallel: 2
  ep_size: 2
  max_model_len: 32768
  max_prefill_tokens: 16384
  kv_cache_dtype: bf16
  gpu_memory_utilization: 0.88
  oom_guard_mb: 4096
  max_num_seqs: 8
  max_batch_size: 8
  speculative: true
  num_drafts: 7
  enable_prefix_caching: true
  fast_load_prefetch_shards: true
  default_chat_template_kwargs: "'{\"reasoning_effort\":\"low\"}'"

