recipe_version: "2"
model: nvidia/Qwen3.8-27B-NVFP4
runtime: atlas
container: ghcr.io/atlas-inf/atlas-gb10:latest
max_nodes: 1

metadata:
  description: |
    Qwen3.8-27B (nvidia NVFP4, dense hybrid SSM+Attn) with DFlash2 block-diffusion
    speculative decoding — the BATCHED / THROUGHPUT profile. Sibling of
    `qwen3.8-27b-nvfp4-dflash2.yaml`, which stays single-stream
    (max_batch_size 1) for peak per-request rate.

    This profile raises max_batch_size to 16 so concurrent requests share one
    batched DFlash2 step: a single B×γ drafter forward proposes for every
    active request (atlas#86 batched propose: one weight read for all
    sequences instead of one per sequence) and one fused verify checks all of
    them (up to 16 × (γ+1) = 128 rows per pass since atlas#86 raised
    VERIFY_ROW_CAP from 96 to 128). It needs an Atlas image that contains
    atlas#86.

    MEASURED RESULT (reiner job 405, GB10, `spark benchmark run
    concurrency-sweep` gate instrument: C 1/4/8/16, ISL 512, OSL 320;
    γ=8, Option B, util 0.70, bf16 KV, thinking off; 2 interleaved reps,
    0 request errors, 0 fallbacks):

      C      batched propose (default)   serial propose (=0 rollback)
        1         23.4 / 23.6                 23.5 / 23.5
        4         43.5 / 46.3                 40.3 / 36.9
        8         66.5 / 65.4                 44.5 / 47.0
       16         75.0 / 75.2                 54.0 / 53.6

    Every rung clears the 27B concurrency-gate floors (17.0 / 35.0 / 52.0 /
    73.5 aggregate tok/s — MTP-derived, the gate keys baselines by
    checkpoint). Images before atlas#86 measured 25.2 / 33.6 / 40.2 / 42.1
    (serial propose, lane c8b88c6, job 208).

    ★ ENV STACK — no `env:` key exists in the recipe struct; export before
    serve (same contract as the single-stream sibling):

      ATLAS_DFLASH_OPTION_B        # paged Option-B drafter — ON by default
                                 # since atlas#86 (=0 restores the legacy
                                 # contiguous path, which cannot batch);
                                 # older images need =1 exported
      ATLAS_DFLASH_BATCHED_PROPOSE # batched B×γ propose — ON by default since
                                 # atlas#86 when Option B + one lane; =0 is
                                 # the rollback to per-sequence propose
      ATLAS_DFLASH_STEP_TIMING=1   # per-step propose/verify timing to stderr
      ATLAS_MTP_ACCEPT_DEBUG=1     # per-verify acceptance lines; this is how
                                 # you confirm the batched path engaged —
                                 # look for K=γ verify lines covering every
                                 # active request, not one per request

    ATLAS_DFLASH_PROPOSE_LANES: leave UNSET. Multi-lane batched propose is
    merged (#64) and functionally correct, but measured not-yet-a-perf-win —
    the default single lane is the validated config.

    WHEN NOT TO USE THIS. For a single interactive user the single-stream
    sibling is the right profile — batching adds per-step workspace it never
    amortizes at C=1. For long agentic trajectories see
    `qwen3.8-27b-nvfp4-agentic.yaml`.

    num_drafts deliberately absent (same as sibling): --dflash derives
    num_drafts = γ-1 = 7; an explicit --num-drafts trips the flag validator.

    enable_prefix_caching stays FALSE — see the single-stream sibling for the
    measured reason: since atlas#96 cache hits are output-correct, but the
    DFlash2 drafter's context is not restored on a hit, so acceptance
    collapses to ~0 on cached turns. Multi-turn agentic serving belongs on
    `qwen3.8-27b-nvfp4-agentic.yaml` (MTP + prefix caching). The batched
    path with caching on is not yet measured.

    NOTE on observing acceptance: thinking defaults ON; the scheduler
    serializes inside <think> unless ATLAS_DFLASH_SPEC_THINK=1 — a probe that
    never exits <think> reports serial=1.00 mean_na=0.000. Expected, not a
    DFlash failure.
  maintainer: Atlas
  category: agent
  model_params: 27B dense hybrid (48 GDN linear-attn + 16 softmax-attn layers)
  model_dtype: nvfp4
  quantization: "NVFP4 (mixed precision — FP8 linear_attn/self_attn, NVFP4 MLP)"
  kv_dtype: bf16
  updated: "2026-09-26"

defaults:
  host: 0.0.0.0
  port: 8888
  max_model_len: 8192
  max_batch_size: 16
  gpu_memory_utilization: 0.70
  kv_cache_dtype: bf16
  lm_head_dtype: bf16
  kv_high_precision_layers: auto
  scheduling_policy: slai
  enable_prefix_caching: false
  ssm_cache_slots: 256
  ssm_checkpoint_interval: 16
  speculative: false
  dflash: true
  draft_model: incoai/Qwen3.8-27B-DFlash2
  dflash_gamma: 8
  # num_drafts intentionally absent: --dflash derives it as γ-1 (=7), and an
  # explicit --num-drafts trips the flag validator on current images.
  dflash_window_size: 4096
  mtp_gate: force
  gdn_fused_norm: true
  video_allow_ffmpeg: true
