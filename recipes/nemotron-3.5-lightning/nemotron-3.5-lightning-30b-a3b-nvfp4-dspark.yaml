recipe_version: "2"
model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
runtime: atlas
container: azeezish/atlas-gb10:latest
max_nodes: 1

metadata:
  description: |
    Nemotron-3.5-Lightning-30B-A3B at NVFP4 with DSpark speculative decoding
    on a single GB10 (SM121).

    Lightning is the hybrid Mamba-2 + MoE + Attention Nemotron-H backbone
    (hidden 2688, same as Nano, so it binds the inherited Nano SM121 kernel
    shadow) plus `num_nextn_predict_layers=1` and `mtp.*` tensors. DSpark is
    the separate 6-layer `Qwen3DSparkModel` drafter published alongside it:
    it proposes gamma=4 tokens per step from captured target hidden states
    over a 1024-token sliding window, and the target verifies them in one
    batched K=3 step.

    DSpark is NOT `--speculative` (Atlas MTP): the two flags are mutually
    exclusive. `--dflash` selects the external drafter, and `--num-drafts`
    is derived from `--dflash-gamma`, never passed by hand. Verified on a
    GB10: the server logs `num_drafts=3` from `gamma=4`.

    The four `dflash*` / `draft_model` keys below are NEW registry surface — no
    other recipe in this repo uses them. THE ATLAS-SIDE MAPPING IS NOW VERIFIED
    (2026-09-01), against the engine rather than assumed:
    `recipe/schema.rs::flag_for` turns a `defaults:` key into a flag by swapping
    underscores for dashes, with a three-entry rename table (`max_model_len`,
    `tensor_parallel`, `host`) and an EMPTY `NOT_FLAGS` list, and `argv_for`
    renders `dflash: true` as the bare `--dflash` because clap reports it as a
    presence-only flag. Every one of the fourteen keys in `defaults:` below was
    checked against `spark serve --help` on a real binary: fourteen resolve,
    zero unmapped. What is still unverified is only sparkrun's own `atlas`
    runtime — a different program in a different repo — not Atlas.

    The equivalent direct invocation, which HAS been run on a GB10, is:

      ATLAS_DFLASH_OPTION_B=1 spark serve <target> \
        --dflash --draft-model <drafter> \
        --dflash-gamma 4 --dflash-window-size 1024 \
        --max-seq-len 32768 --kv-cache-dtype fp8 \
        --gpu-memory-utilization 0.80 --max-batch-size 8 \
        --ssm-cache-slots 256 --dflash-window-size 1024

    `ATLAS_DFLASH_OPTION_B=1` is REQUIRED: the Lightning DSpark product policy
    (`dflash_head/product_policy.rs::validate`) refuses to start without it,
    and refuses to start if any DSpark diagnostic toggle is present.

    ⚠ THE ENV STACK BELOW IS PART OF THIS CONFIGURATION AND THE RECIPE SCHEMA
    CANNOT EXPRESS IT. `defaults:` carries serve FLAGS only — there is no
    `env:` key in the Atlas recipe struct today — so these must be exported by
    whoever starts the server:

      ATLAS_DFLASH_OPTION_B=1   # required, see above
      ATLAS_NO_TOOL_INJECT=1    # +15.58 BFCL overall, see below

    ATLAS_NO_TOOL_INJECT is worth more on this model than every other knob in
    this file combined, and it is DEFAULT OFF in the engine. Atlas normally
    renders the tool contract TWICE — once from the jinja template, once
    injected by the tool parser on top — and on a BFCL parallel prompt the
    duplicate measures +1019 tokens, roughly 3x the native prompt. The flag
    skips the injection so the template's block stands alone, which is what
    vLLM does. Measured on a GB10, golden n=995 draw, same weights, same
    scorer, thinking ON throughout:

      config                          overall  normalized  halluc  live  non_live
      shipped (injection on)            64.22     71.25     94.51  68.24   51.01
      vLLM 0.28.0 (reference engine)    73.57     78.18     99.43  71.18   63.94
      ATLAS_NO_TOOL_INJECT=1            79.80     82.40     96.21  77.06   73.92
      ATLAS_NO_TOOL_INJECT=1 (rerun)    79.60     82.32

    Two draws, 0.20 apart. It is the parallel-calling family that moves:
    `parallel` 20.16 -> 75.00 and `live_parallel` 18.75 -> 87.50, both past
    vLLM's 58.06 / 75.00. Hallucination ROSE (94.51 -> 96.21), so nothing was
    traded — despite `prepare.rs` warning that this injection is load-bearing
    for the hallucination category. That warning is why the flag ships off and
    why a subset win was not treated as sufficient; the full draw disproved it.

    ⚠ NOT YET A DEFAULT, AND THIS RECIPE DOES NOT MAKE IT ONE. Both draws are
    single-turn. The multi-turn hazard the injection was written for cannot be
    exercised by BFCL ST at all, so nothing here licenses flipping the engine
    default. `simple_java` is also the one subset that REGRESSES without the
    injection (59.68 -> 50.00) and nobody has explained it.

    Measured on a GB10 (2026-08-26), three reps per level, 512 output tokens,
    zero failed requests at every level: 76.1 / 95.8 / 120.6 / 104.1 / 140.3
    aggregate tok/s at concurrency 1 / 2 / 4 / 6 / 8 — 1.84x at C8 over C1,
    17.6 tok/s per client. See the `gpu_memory_utilization` note below for why
    that knob is 0.80 rather than 0.88; 0.88 does not survive C8 on this box.

    Coherence: `scripts/dev/coherence_test.py` passes 10/10. Run it with
    `--disable-thinking`. This model's MODEL.toml sets `thinking_default =
    true` AND `cap_thinking_at_max_tokens = false`, so a small `max_tokens`
    is spent entirely inside the reasoning block and `content` comes back
    empty — correct behaviour that reads as incoherence. With thinking left on
    and a large enough budget the same prompts answer correctly.

    Do NOT pass `--disable-thinking` in production on this model: with thinking
    forced off, multi-turn tool follow-ups return null `content`. With the
    model's declared default the tool path is fine.

    And do NOT pass it alongside ATLAS_NO_TOOL_INJECT either, which is a
    separate and stronger reason. The two interact, and the sign flips:

      config                thinking ON   thinking OFF    delta
      injection on             64.22         67.64       +3.42
      ATLAS_NO_TOOL_INJECT     79.80         65.93      -13.87

    Thinking-off HELPS while the duplicated prompt is present and costs 13.87
    once it is gone. On a clean prompt the reasoning block is REQUIRED for
    parallel calling — `parallel` 75.00 with thinking on versus 22.58 with it
    off. Any measurement of thinking taken under the old injected prompt does
    not transfer to this configuration.
  maintainer: atlas-inf
  category: agent
  model_params: 30B
  model_dtype: nvfp4
  quantization: nvfp4
  kv_dtype: fp8

defaults:
  port: 8888
  host: 0.0.0.0
  max_model_len: 32768
  kv_cache_dtype: fp8
  # 0.80, NOT the 0.88 this recipe originally carried. Measured on a GB10
  # (119 GB unified) on 2026-08-26: at 0.88 the box has ~6 GB of host memory
  # left once the model is resident, and concurrency 8 exhausts it in about
  # two seconds -- 6.4 GB available to 180 MB between consecutive samples --
  # taking the machine off the network. At 0.80 the post-load headroom is
  # ~15.8 GB and the full 1/2/4/6/8 ladder completes with zero failures.
  # This is a cliff, not a gradient; do not raise it without re-measuring.
  gpu_memory_utilization: 0.80
  scheduling_policy: slai
  # DSpark drafter. `dflash: true` maps to `--dflash`; the drafter id falls
  # through from the target's MODEL.toml [dflash].draft_model when omitted,
  # but it is pinned here so the recipe is self-describing.
  dflash: true
  draft_model: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
  # gamma 4 / K=3 is the published Lightning DSpark contract and the shape
  # the drafter's block attention was trained for. The server CLI default is
  # 16 (the z-lab DFlash drafters); leaving it unset would silently mis-size
  # the proposal block.
  dflash_gamma: 4
  # The drafter's own SWA window. CLI default is 4096; Lightning's drafter
  # config declares 1024.
  dflash_window_size: 1024
  # Prefix caching is OFF on purpose: the server warns of a community-reported
  # correctness regression on SM12.x with DFlash (wrong outputs on multi-turn
  # cache hits). It is not merely a perf knob here.
  enable_prefix_caching: false
  # 8 is the server default and is now measured, not assumed: the concurrency
  # ladder was run to 8 on a GB10 at the gpu_memory_utilization above, three
  # reps per level, 512 output tokens, zero failed requests at every level.
  #
  #   C   agg tok/s   vs C1   per-client   mean E2E
  #   1       76.13   1.00x        76.14      6.72s
  #   2       95.81   1.26x        47.93     10.68s
  #   4      120.58   1.58x        30.18     16.97s
  #   6      104.10   1.37x        17.37     29.48s
  #   8      140.33   1.84x        17.57     29.15s
  #
  # The dip at 6 is reproducible and not understood; 6 requests do not divide
  # into the max-batch-8 decode step as evenly as 8 do. It is a throughput
  # artifact, not an error -- C6 fails nothing.
  max_batch_size: 8
  ssm_cache_slots: 256
  oom_guard_mb: 1024
